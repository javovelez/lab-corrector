title: Laboratorio 2
ejercicios:
- id: ej1
  titulo: Correlación cruzada manual
  enunciado_cell: ej1-enunciado
  code_cell: ej1-code
  pregunta_cell: ej1-pregunta
  answer_cell: ej1-respuesta
  graded_outputs:
  - text
  rubric:
    expected: Se espera implementar `corr2d(X, K)` con dos bucles `for` que recorran las posiciones de
      salida, extraigan la ventana `X[i:i+kH, j:j+kW]`, la multipliquen elemento a elemento por `K` y
      sumen con `.sum()`, guardando el resultado en `Y` de forma `(H-kH+1, W-kW+1)`. Además, debe construir
      la imagen `X` de 6×6 con `X[3:, :] = 1.0`, aplicar el kernel Sobel vertical indicado y mostrar entrada,
      mapa resultante y verificación de la forma.
    common_errors:
    - 'CRÍTICO: calcular mal las dimensiones de salida (usar `H_in` en lugar de `H_in - kH + 1`) o invertir
      los índices, provocando errores de shape o recorrer fuera de rango.'
    - Construir la imagen al revés (mitad superior en 1.0 y mitad inferior en 0.0) o usar `X[:3, :] =
      1.0`, lo que invierte el signo del borde detectado.
    - Olvidar inicializar `Y` con `torch.zeros(H_out, W_out)` o acumular sobre un tensor con dtype incorrecto
      (por ejemplo, entero), lo que trunca los valores del Sobel.
    - Transponer o tipear mal el kernel Sobel (intercambiar filas positivas y negativas, o usar enteros
      sin punto decimal), alterando la magnitud o el signo del mapa de características.
    - Usar slicing incorrecto como `X[i:i+kH-1, j:j+kW-1]` o `X[i:kH, j:kW]` en vez de `X[i:i+kH, j:j+kW]`,
      produciendo ventanas de tamaño equivocado.
    - En el análisis, confundir convolución con correlación cruzada afirmando que son idénticas matemáticamente,
      o no mencionar que al aprender el kernel la diferencia se vuelve irrelevante.
- id: ej2
  titulo: Kernels con significado
  enunciado_cell: ej2-enunciado
  code_cell: ej2-code
  pregunta_cell: ej2-pregunta
  answer_cell: ej2-respuesta
  graded_outputs:
  - text
  rubric:
    expected: El alumno debe crear una imagen `torch.zeros(1, 1, 9, 9)` con `img[0, 0, 4:6, :] = 1.0`,
      definir los tres kernels (Identidad, Sobel horizontal y Gaussiano normalizado por 1/16), y para
      cada uno instanciar `nn.Conv2d(1, 1, kernel_size=3, bias=False)` asignando los pesos con `conv.weight[0,
      0] = K` bajo `torch.no_grad()`, imprimiendo la salida con `.detach()`, redondeada a 2 decimales,
      y su shape. En el análisis debe explicar que Identidad preserva la imagen, Sobel activa en las filas
      de transición 0→1 y 1→0, y el Gaussiano suaviza los bordes promediando vecinos.
    common_errors:
    - 'CRÍTICO: armar la imagen sin la forma (N, C, H, W) (por ejemplo `torch.zeros(9, 9)`) y que `nn.Conv2d`
      falle o dé shapes incorrectos.'
    - Olvidar dividir el kernel Gaussiano por 16, obteniendo valores fuera del rango esperado en la franja
      suavizada.
    - Asignar los pesos sin `torch.no_grad()` o usar `conv.weight = K` en lugar de `conv.weight[0, 0]
      = K`, rompiendo el grafo o la forma del tensor de pesos.
    - No usar `.detach()` al imprimir la salida y mostrar el tensor con `grad_fn`, o no redondear a 2
      decimales como pide la consigna.
    - En el análisis, confundir qué detecta Sobel horizontal (decir que detecta bordes verticales) o no
      notar que los valores no nulos aparecen en las filas de transición por encima y debajo de la franja.
    - Instanciar una sola `nn.Conv2d` reutilizada sin reasignar pesos, o no iterar sobre los tres kernels,
      quedando resultados incompletos.
- id: ej3
  titulo: Aprender un kernel con gradiente descendente
  enunciado_cell: ej3-enunciado
  code_cell: ej3-code
  pregunta_cell: ej3-pregunta
  answer_cell: ej3-respuesta
  graded_outputs:
  - text
  rubric:
    expected: Se espera definir `conv = nn.Conv2d(1,1,kernel_size=3,padding=1,bias=False)`, `nn.MSELoss()`
      y `torch.optim.SGD(conv.parameters(), lr=0.02)`, y correr un bucle de 150 épocas que haga forward
      `conv(X_data)`, calcule la pérdida contra `Y_data`, y ejecute `zero_grad()`, `backward()` y `step()`,
      imprimiendo la pérdida cada 30 épocas y comparando `conv.weight.data` con `kernel_verdadero` al
      final.
    common_errors:
    - 'CRÍTICO: Olvidar `optimizador.zero_grad()` dentro del bucle, con lo cual los gradientes se acumulan
      y el entrenamiento diverge o no converge al kernel verdadero.'
    - Pasar los parámetros equivocados al optimizador (por ejemplo omitir `conv.parameters()` o usar otro
      `lr`), impidiendo que se actualice el kernel correctamente en 150 épocas.
    - Invertir el orden de los pasos, por ejemplo llamar a `step()` antes de `backward()` o hacer `backward()`
      sin haber calculado la pérdida del forward actual.
    - Calcular la pérdida con los argumentos invertidos o comparar contra `X_data` en vez de `Y_data`,
      lo que hace que la red no aprenda el kernel Laplaciano.
    - Instanciar el `Conv2d` con `bias=True` o sin `padding=1`, cambiando la shape de salida o agregando
      un parámetro extra que distorsiona la comparación con `kernel_verdadero`.
    - Imprimir `conv.weight` sin `.data` o sin `.squeeze()`, mostrando el tensor con `grad_fn` y shape
      `(1,1,3,3)` en lugar del kernel 3×3 legible para comparar.
- id: ej4
  titulo: Efecto del padding sobre las dimensiones
  enunciado_cell: ej4-enunciado
  code_cell: ej4-code
  graded_outputs:
  - text
  rubric:
    expected: Se espera crear un tensor `x` de forma (1,1,5,5) con `torch.manual_seed(0)` y `torch.randn`,
      definir dos `nn.Conv2d` con kernel 3×3 y stride 1 (una con `padding=0` y otra con `padding=1`),
      pasar `x` por ambas e imprimir las formas de salida, y verificar con la fórmula `H_out = (H_in +
      2*p - k) // s + 1` que sin padding da 3 y con padding=1 da 5.
    common_errors:
    - 'CRÍTICO: olvidar `torch.manual_seed(0)` o usar una forma de entrada distinta a (1,1,5,5), lo que
      rompe la reproducibilidad y las dimensiones esperadas'
    - Invertir o confundir los casos `padding=0` y `padding=1`, reportando 5×5 como 'sin padding' y 3×3
      como 'con padding'
    - Aplicar mal la fórmula (por ejemplo, olvidar el `2*p`, usar división real `/` en vez de entera `//`,
      o sumar el `+1` en el lugar equivocado)
    - No pasar `x` por la convolución o imprimir solo la forma de entrada, sin comparar con la salida
      real `y.shape`
    - Usar `kernel_size` o `stride` distintos a los pedidos (3 y 1), o definir `in_channels`/`out_channels`
      incorrectos en `nn.Conv2d`
    - Comparar `H_out_formula` contra `y.shape` completo en vez de `y.shape[-1]`, lo que hace que la verificación
      siempre falle
- id: ej5
  titulo: 'padding=''same'': preservar las dimensiones espaciales'
  enunciado_cell: ej5-enunciado
  code_cell: ej5-code
  pregunta_cell: ej5-pregunta
  answer_cell: ej5-respuesta
  graded_outputs:
  - text
  rubric:
    expected: El alumno debe crear `x` con forma (1,1,7,7), aplicar `nn.Conv2d(1,1,kernel_size=5,padding='same')`
      y verificar que la salida conserva la forma (1,1,7,7). Luego calcular `p_equiv = (k-1)//2 = 2` y
      comprobar que `nn.Conv2d(..., padding=p_equiv)` produce la misma forma que `padding='same'`.
    common_errors:
    - 'CRÍTICO: usar una forma de entrada incorrecta (por ejemplo (1,7,7) sin dimensión de batch o canal),
      lo que hace que `Conv2d` falle o devuelva formas inesperadas.'
    - Calcular mal el padding equivalente, usando `k//2` sin restar 1 o dividiendo por 2 con float (`(k-1)/2`)
      en vez de división entera, generando error al pasarlo a `padding=`.
    - No comparar las formas de `y_same` y `y_manual`, quedándose sólo con el print sin verificar la igualdad.
    - En la pregunta de análisis, responder que existe un entero exacto de padding para stride>1 sin notar
      que la fórmula da un intervalo no entero y que por eso PyTorch lo prohíbe.
    - Confundir `padding='same'` con `padding=0` o asumir que 'same' siempre funciona (incluso con stride>1),
      sin justificar por qué PyTorch lanza error.
    - Olvidar aplicar la convolución al tensor (`conv_same(x)`) y querer inspeccionar la forma directamente
      desde la capa.
- id: ej6
  titulo: Efecto del stride sobre las dimensiones
  enunciado_cell: ej6-enunciado
  code_cell: ej6-code
  pregunta_cell: ej6-pregunta
  answer_cell: ej6-respuesta
  graded_outputs:
  - text
  rubric:
    expected: El alumno debe crear un tensor x de forma (1,1,8,8), iterar sobre strides [1,2,4] aplicando
      nn.Conv2d con kernel=3 y padding=1, y comparar H_out real (y.shape[-1]) contra la fórmula (H_in
      + 2*p - k) // s + 1, obteniendo 8, 4 y 2 respectivamente. En el análisis debe distinguir que stride=2
      submuestrea durante la convolución mientras MaxPool2d lo hace después, y reconocer que ninguna de
      las dos opciones agrega parámetros entrenables adicionales.
    common_errors:
    - 'CRÍTICO: Usar división real (/) en lugar de división entera (//) en la fórmula, obteniendo floats
      o valores incorrectos cuando (H_in + 2*p - k) no es divisible por s (por ejemplo con s=4 da 2.25
      en vez de 2).'
    - Olvidar sumar el +1 final en la fórmula (H_in + 2*p - k) // s + 1, subestimando H_out en todos los
      casos.
    - Confundir el rol del padding y no incluir el 2*p en la fórmula, o usar p=0 cuando la consigna pide
      padding=1.
    - Afirmar que MaxPool2d tiene parámetros entrenables o que stride=2 agrega/quita parámetros respecto
      a stride=1, cuando ninguno de los dos modifica la cantidad de parámetros del kernel.
    - Reutilizar la misma capa conv para los tres strides en vez de instanciar una nn.Conv2d nueva dentro
      del loop con el stride correspondiente.
    - Leer la dimensión de salida con y.shape[0] o y.shape[1] en lugar de y.shape[-1] (o shape[2]/[3]),
      confundiendo batch/canales con dimensión espacial.
- id: ej7
  titulo: 'Diseño dimensional: encontrá stride y padding'
  enunciado_cell: ej7-enunciado
  code_cell: ej7-code
  pregunta_cell: ej7-pregunta
  answer_cell: ej7-respuesta
  graded_outputs:
  - text
  rubric:
    expected: 'El alumno debe despejar analíticamente stride de la fórmula de salida (Parte A: s = (H_in+2p-k)/(H_out-1)
      = 27/13 ≈ 2) y padding (Parte B: p = ((H_out-1)·s - H_in + k)/2 = 0.5, redondeado a 1), verificar
      ambos casos con nn.Conv2d obteniendo salida 14×14, y responder que el numerador (H_out-1)·s - H_in
      + k debe ser par para que p sea entero.'
    common_errors:
    - 'CRÍTICO: Despejar mal la fórmula (por ejemplo, olvidar el +1 final y usar H_out en lugar de H_out-1,
      o invertir numerador/denominador) y obtener stride/padding incorrectos.'
    - En la Parte B no notar que p=0.5 no es entero y pasar un float a nn.Conv2d, que lanza error, en
      vez de redondear a p=1 y verificar que igual da 14×14 por el floor.
    - Confundir el orden de las operaciones en el numerador (por ejemplo calcular H_in - k + 2p en vez
      de H_in + 2p - k) alterando el resultado numérico.
    - Crear el tensor de entrada con shape incorrecta (sin las dimensiones batch y canal, por ejemplo
      torch.randn(28,28)) y hacer fallar el forward de nn.Conv2d.
    - En la pregunta de análisis, no indicar la condición de paridad del numerador (H_out-1)·s - H_in
      + k y limitarse a escribir la fórmula de p.
    - No verificar con .shape que la salida sea efectivamente 14×14, dando por válido un resultado sin
      comprobación.
- id: ej8
  titulo: Conteo de parámetros de capas convolucionales
  enunciado_cell: ej8-enunciado
  code_cell: ej8-code
  pregunta_cell: ej8-pregunta
  answer_cell: ej8-respuesta
  graded_outputs:
  - text
  rubric:
    expected: Se espera que el alumno calcule los parámetros de cada conv como out_ch × in_ch × kH × kW
      + out_ch (obteniendo 448 y 4640), los verifique con sum(p.numel() for p in conv.parameters()), y
      compare con nn.Linear(3*28*28, 16) que da 37.648 parámetros, concluyendo sobre la eficiencia del
      parámetro compartido.
    common_errors:
    - 'CRÍTICO: Olvidar multiplicar por in_channels en la fórmula de pesos (por ejemplo calcular 16×3×3
      en vez de 16×3×3×3), dando un total que no coincide con el real.'
    - No sumar los biases (out_channels) al total, obteniendo 432 y 4608 en vez de 448 y 4640.
    - Confundir el bias con in_channels o con kH×kW en lugar de out_channels.
    - En la capa densa, olvidar el bias de salida (16) y calcular solo 3·28·28·16 = 37.632 en vez de 37.648,
      o directamente usar mal las dimensiones de entrada.
    - No verificar con sum(p.numel() for p in conv.parameters()) y quedarse solo con el cálculo analítico,
      perdiendo la comprobación pedida.
    - En el análisis, no mencionar el parámetro compartido (weight sharing) como razón de la eficiencia,
      o no vincularlo con la independencia respecto a la resolución de la imagen.
- id: ej9
  titulo: MaxPool y AvgPool
  enunciado_cell: ej9-enunciado
  code_cell: ej9-code
  pregunta_cell: ej9-pregunta
  answer_cell: ej9-respuesta
  graded_outputs:
  - text
  rubric:
    expected: El alumno debe crear `x = torch.arange(1, 17, dtype=torch.float32).reshape(1, 1, 4, 4)`,
      aplicar `nn.MaxPool2d(kernel_size=2)` y `nn.AvgPool2d(kernel_size=2)` imprimiendo salidas `[[6,8],[14,16]]`
      y `[[3.5,5.5],[11.5,13.5]]` respectivamente, y además usar `nn.MaxPool2d(kernel_size=3, stride=1,
      padding=1)` verificando que preserva la forma (1,1,4,4). La respuesta de análisis debe justificar
      MaxPool para detectar presencia de características (clasificación) y AvgPool para resúmenes suaves
      (Global Average Pooling).
    common_errors:
    - 'CRÍTICO: Generar el tensor con forma incorrecta, por ejemplo usar `torch.arange(16)` (valores 0–15)
      o no hacer `.reshape(1, 1, 4, 4)` y quedar con 2D, lo que rompe las capas de pooling que esperan
      (N, C, H, W).'
    - Usar `torch.arange` sin `dtype=torch.float32`, produciendo un tensor entero que falla al aplicar
      `AvgPool2d` (requiere floats).
    - Instanciar la capa y no aplicarla al tensor (por ejemplo escribir `nn.MaxPool2d(kernel_size=2)(x)`
      mal anidado, o confundir llamada con método), obteniendo objetos en lugar de tensores.
    - No incluir la verificación manual en comentarios de los bloques 2×2 (máximos y promedios), o calcular
      mal los promedios al dividir por 2 en vez de 4.
    - Asumir que `MaxPool2d(kernel_size=3, stride=1, padding=1)` reduce la dimensión, cuando en realidad
      la preserva en (4,4).
    - En el análisis, invertir los casos de uso (decir que AvgPool detecta presencia fuerte y MaxPool
      promedia), o no mencionar Global Average Pooling como aplicación típica de AvgPool.
- id: ej10
  titulo: 'LeNet mejorado: arquitectura y dimensiones'
  enunciado_cell: ej10-enunciado
  code_cell: ej10-code
  pregunta_cell: ej10-pregunta
  answer_cell: ej10-respuesta
  graded_outputs:
  - text
  rubric:
    expected: Definir `lenet_mejorado(num_classes=10)` que retorne un `nn.Sequential` con dos bloques
      LazyConv2d (6 filtros 5x5 padding 2, y 16 filtros 5x5 sin padding) cada uno seguido de ReLU y MaxPool2d(2,
      stride=2), luego Flatten y tres LazyLinear (120, 84, num_classes) con ReLU entre las dos primeras.
      Instanciar el modelo y llamar a `layer_summary(model, (1, 1, 28, 28))`. La respuesta de análisis
      debe mencionar al menos dos ventajas de ReLU sobre Sigmoid (gradiente no saturante/mitigación del
      evanescente y menor costo computacional).
    common_errors:
    - 'CRÍTICO: omitir `nn.Flatten()` antes de las capas LazyLinear, lo que provoca un error de forma
      al pasar el tensor 4D al clasificador.'
    - Poner padding=2 en la segunda convolución o quitarle el padding a la primera, alterando las dimensiones
      espaciales que verifica `layer_summary`.
    - Olvidar alguna ReLU entre capas (por ejemplo, tras las convoluciones o entre las LazyLinear), o
      agregar ReLU después de la última capa de salida.
    - Usar `nn.Conv2d`/`nn.Linear` en lugar de las versiones Lazy, obligando a calcular a mano `in_channels`/`in_features`
      y rompiendo la inferencia automática.
    - Configurar mal el MaxPool2d (por ejemplo, stride distinto de 2 o kernel 3x3), cambiando las dimensiones
      esperadas.
    - En el análisis, responder solo con 'ReLU es mejor' sin justificar con gradiente evanescente ni con
      el costo de la exponencial de Sigmoid.
- id: ej11
  titulo: Entrenamiento en Fashion-MNIST
  enunciado_cell: ej11-enunciado
  code_cell: ej11-code
  pregunta_cell: ej11-pregunta
  answer_cell: ej11-respuesta
  graded_outputs:
  - image
  - text
  rubric:
    expected: Se espera materializar las capas Lazy con un forward pass antes de aplicar `model.apply(init_pesos)`,
      definir Adam (lr=1e-3) y CrossEntropyLoss, entrenar 10 épocas acumulando `train_loss`, `train_acc`,
      `test_loss` y `test_acc` en `hist`, y graficar las curvas Train vs Test en dos subgráficos. El análisis
      debe identificar overfitting (gap creciente entre train y test) y proponer regularizadores como
      Dropout, BatchNorm o Data Augmentation.
    common_errors:
    - 'CRÍTICO: aplicar `model.apply(init_pesos)` sin hacer antes el forward pass de materialización,
      lo que rompe la ejecución por los tensores Lazy aún no creados.'
    - Olvidar `optimizer.zero_grad()` dentro del loop, acumulando gradientes entre batches y degradando
      el entrenamiento.
    - No llamar a `model.eval()` ni envolver la evaluación en `torch.no_grad()`, distorsionando métricas
      de test y consumiendo memoria de más.
    - No mover `X`, `y` o `X_lote` al `device`, generando errores de mismatch entre CPU y GPU.
    - Promediar mal las métricas (sumar `.item()` sin dividir por la cantidad de lotes `n`, o usar tamaños
      de batch desparejos) dejando valores inflados en `hist`.
    - Graficar todo en un solo eje o sin leyenda/títulos/etiquetas, impidiendo comparar Train vs Test
      en pérdida y exactitud.
- id: ej12
  titulo: Implementar ResNet-34
  enunciado_cell: ej12-enunciado
  code_cell: ej12-code
  pregunta_cell: ej12-pregunta
  answer_cell: ej12-respuesta
  graded_outputs:
  - text
  rubric:
    expected: Definir `ResNet34` heredando de `ResNet` e invocar `super().__init__(arch=((3,64),(4,128),(6,256),(3,512)),
      num_classes=num_classes)`. Luego instanciar `model = ResNet34()`, hacer un forward pass con un tensor
      `(1,3,224,224)` para materializar los módulos lazy y verificar salida `(1,10)` y ~21M parámetros.
      En el análisis, justificar el `+1` en la derivada de la skip connection y el rol de la conv 1x1
      para proyectar canales/stride en el primer bloque de cada grupo.
    common_errors:
    - 'CRÍTICO: Pasar una `arch` equivocada (por ejemplo (2,3,4,3) de ResNet-18/50 o invertir el orden
      bloques/canales como ((64,3),(128,4),...)), lo que cambia la cantidad de parámetros y la profundidad.'
    - Omitir el forward pass previo al conteo de parámetros, con lo cual los módulos `LazyConv2d`/`LazyBatchNorm2d`
      no materializan pesos y `sum(p.numel()...)` devuelve un número mucho menor o cero.
    - Usar un tamaño de entrada incorrecto (por ejemplo (1,1,28,28) o (3,224,224) sin batch), rompiendo
      el forward o dando shape de salida distinta a `(1,10)`.
    - Reimplementar la cabeza (`AdaptiveAvgPool`, `Flatten`, `Linear`) o el `Base` dentro de `ResNet34`
      en lugar de delegar todo a `super().__init__`.
    - En el análisis, confundir el efecto de la skip connection diciendo que 'multiplica' el gradiente
      en vez de sumarle 1, perdiendo la intuición del camino directo cuando $\partial\mathcal{F}/\partial
      x \approx 0$.
    - Responder que la conv 1x1 se usa en todos los bloques del grupo, sin notar que solo hace falta cuando
      cambian canales o stride para igualar las dimensiones de $x$ y $\mathcal{F}(x)$.
